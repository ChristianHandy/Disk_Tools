<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Login</title>
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>
      <form method="post" action="{{ url_for('login') }}">
        <div>
          <label>Username</label>
          <input name="username" />
        </div>
        <div>
          <label>Password</label>
          <input type="password" name="password" />
        </div>
        <input type="hidden" name="next" value="{{ next }}" />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
